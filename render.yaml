# Render blueprint - https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render choose "New" > "Blueprint"
# and point it at the repository. No settings to fill in by hand.
services:
  - type: web
    runtime: static
    name: euro-banknote-proposals
    plan: free
    buildCommand: bash build.sh
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      # Fingerprint-free filenames, but the ECB's proposal images never change.
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
